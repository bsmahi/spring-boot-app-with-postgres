<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Spring Boot application GitOps deployment and runtime architecture</title>
  <desc id="description">Developer builds and pushes a container image to GHCR and commits Kubernetes manifests to Git. Argo CD reads the manifests and reconciles resources through the Kubernetes API. Kubernetes runs Spring Boot pods, routes user requests through a Service, and connects to managed PostgreSQL using a Kubernetes Secret.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#eefbf8"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#4263eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0f9f8f"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#805ad5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 750; fill: #fff; letter-spacing: -.5px; }
      .subtitle { font-size: 16px; fill: #dbeafe; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 1.4px; fill: #64748b; }
      .card-title { font-size: 18px; font-weight: 700; }
      .card-copy { font-size: 13px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .flow { font-size: 12px; font-weight: 650; fill: #475569; }
      .number { font-size: 12px; font-weight: 750; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#background)"/>
  <rect x="28" y="24" width="1544" height="112" rx="24" fill="url(#header)"/>
  <circle cx="1500" cy="48" r="85" fill="#fff" opacity=".045"/>
  <circle cx="1448" cy="140" r="54" fill="#2dd4bf" opacity=".09"/>
  <text x="66" y="73" class="title">From commit to running application</text>
  <text x="68" y="105" class="subtitle">Spring Boot + GHCR + Argo CD GitOps + Kubernetes + PostgreSQL</text>

  <text x="62" y="180" class="section">1 · BUILD AND PUBLISH THE APPLICATION</text>

  <g filter="url(#shadow)">
    <rect x="62" y="205" width="250" height="142" rx="18" fill="#fff" stroke="#dbe4f0"/>
    <rect x="340" y="205" width="250" height="142" rx="18" fill="#fff" stroke="#dbe4f0"/>
    <rect x="618" y="205" width="250" height="142" rx="18" fill="#fff" stroke="#dbe4f0"/>
    <rect x="896" y="205" width="250" height="142" rx="18" fill="#fff" stroke="#dbe4f0"/>
    <rect x="1174" y="205" width="350" height="142" rx="18" fill="#fff" stroke="#dbe4f0"/>
  </g>
  <g>
    <circle cx="94" cy="239" r="15" fill="#4263eb"/><text x="94" y="239" class="number">1</text>
    <text x="119" y="245" class="card-title">Developer</text>
    <text x="84" y="280" class="card-copy">Changes code and configuration</text>
    <text x="84" y="302" class="card-copy">Runs tests, then commits to Git</text>

    <circle cx="372" cy="239" r="15" fill="#4263eb"/><text x="372" y="239" class="number">2</text>
    <text x="397" y="245" class="card-title">Spring Boot source</text>
    <text x="362" y="280" class="card-copy">Java API, JPA repositories,</text>
    <text x="362" y="302" class="card-copy">Actuator health endpoints</text>

    <circle cx="650" cy="239" r="15" fill="#4263eb"/><text x="650" y="239" class="number">3</text>
    <text x="675" y="245" class="card-title">Build container</text>
    <text x="640" y="280" class="card-copy">Docker multi-stage build</text>
    <text x="640" y="302" class="card-copy">JAR runs on a Java JRE image</text>

    <circle cx="928" cy="239" r="15" fill="#4263eb"/><text x="928" y="239" class="number">4</text>
    <text x="953" y="245" class="card-title">Push image</text>
    <text x="918" y="280" class="card-copy">Versioned image tag</text>
    <text x="918" y="302" class="card-copy">docker push to ghcr.io</text>

    <text x="1200" y="245" class="card-title">GitHub Container Registry</text>
    <text x="1200" y="280" class="card-copy">Stores the application image</text>
    <text x="1200" y="302" class="card-copy">Kubernetes nodes pull this image</text>
  </g>
  <path d="M312 276H332" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M590 276H610" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M868 276H888" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1146 276H1166" fill="none" stroke="#4263eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <text x="62" y="401" class="section">2 · GITOPS DELIVERY — GIT IS THE DESIRED STATE</text>
  <rect x="430" y="420" width="1120" height="410" rx="26" fill="#f8faff" stroke="#a9b8d0" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="456" y="402" width="258" height="36" rx="18" fill="#e7edff"/>
  <text x="478" y="426" font-size="14" font-weight="750" fill="#3348a5">KUBERNETES CLUSTER</text>

  <g filter="url(#shadow)">
    <rect x="62" y="465" width="300" height="176" rx="18" fill="#fff" stroke="#d7ccfa" stroke-width="2"/>
    <rect x="468" y="470" width="235" height="150" rx="18" fill="#f3efff" stroke="#c4b5fd"/>
    <rect x="740" y="470" width="245" height="150" rx="18" fill="#f3efff" stroke="#c4b5fd"/>
    <rect x="1022" y="470" width="245" height="150" rx="18" fill="#edf4ff" stroke="#b8cdfb"/>
    <rect x="1300" y="470" width="220" height="150" rx="18" fill="#edf4ff" stroke="#b8cdfb"/>
  </g>
  <circle cx="94" cy="499" r="15" fill="#805ad5"/><text x="94" y="499" class="number">5</text>
  <text x="119" y="505" class="card-title">Git repository</text>
  <text x="84" y="540" class="card-copy">master branch contains:</text>
  <text x="84" y="563" class="card-copy">k8s/app.yaml</text>
  <text x="84" y="585" class="card-copy">argocd/application.yaml</text>
  <text x="84" y="615" class="small">Reviewable, versioned desired state</text>

  <text x="490" y="508" class="card-title">Argo CD Application</text>
  <text x="490" y="544" class="card-copy">Watches master / k8s;</text>
  <text x="490" y="566" class="card-copy">repo-server fetches manifests</text>
  <text x="490" y="598" class="small">Git is the desired state</text>

  <text x="762" y="508" class="card-title">Argo CD controller</text>
  <text x="762" y="544" class="card-copy">Compares desired Git state</text>
  <text x="762" y="566" class="card-copy">with live cluster resources</text>
  <text x="762" y="598" class="small">Syncs changes and detects drift</text>

  <text x="1044" y="508" class="card-title">Kubernetes API</text>
  <text x="1044" y="544" class="card-copy">Receives declarative resource</text>
  <text x="1044" y="566" class="card-copy">updates from Argo CD</text>
  <text x="1044" y="598" class="small">Schedules and manages workloads</text>

  <text x="1322" y="508" class="card-title">Deployment</text>
  <text x="1322" y="544" class="card-copy">Desired replica count</text>
  <text x="1322" y="566" class="card-copy">Rolling updates and recovery</text>
  <text x="1322" y="598" class="small">Declared in k8s/app.yaml</text>

  <path d="M362 550H460" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <text x="376" y="536" class="flow">Git fetch</text>
  <path d="M703 545H732" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M985 545H1014" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <path d="M1267 545H1292" fill="none" stroke="#805ad5" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <rect x="468" y="668" width="1030" height="112" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="500" cy="701" r="15" fill="#0f9f8f"/><text x="500" y="701" class="number">6</text>
  <text x="525" y="707" class="card-title">Reconcile loop</text>
  <text x="500" y="740" class="card-copy">Argo CD continuously checks Git against the cluster. New commits are applied; drift can be corrected to match Git.</text>
  <text x="500" y="762" class="small">Argo CD deploys Kubernetes configuration; CI/Docker builds and publishes the image separately.</text>
  <path d="M1408 628V650H1490V630" fill="none" stroke="#805ad5" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="1265" y="658" class="flow">live-state feedback</text>

  <text x="62" y="885" class="section">3 · RUNTIME — USER REQUESTS FLOW THROUGH THE SERVICE TO THE API</text>
  <g filter="url(#shadow)">
    <rect x="62" y="912" width="220" height="132" rx="18" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <rect x="318" y="912" width="220" height="132" rx="18" fill="#fff" stroke="#bae6fd" stroke-width="2"/>
    <rect x="574" y="912" width="230" height="132" rx="18" fill="#e8fbf6" stroke="#99e4d4" stroke-width="2"/>
    <rect x="840" y="912" width="315" height="132" rx="18" fill="#fff" stroke="#99e4d4" stroke-width="2"/>
    <rect x="1210" y="912" width="314" height="132" rx="18" fill="#fff" stroke="#f4c98c" stroke-width="2"/>
  </g>
  <text x="84" y="950" class="card-title">User / API client</text>
  <text x="84" y="984" class="card-copy">Calls a REST endpoint</text>
  <text x="84" y="1007" class="small">e.g. GET /api/courses</text>

  <text x="340" y="950" class="card-title">Local access</text>
  <text x="340" y="984" class="card-copy">kubectl port-forward</text>
  <text x="340" y="1007" class="small">localhost:8082 → Service:80</text>

  <text x="596" y="950" class="card-title">Kubernetes Service</text>
  <text x="596" y="984" class="card-copy">Stable ClusterIP endpoint</text>
  <text x="596" y="1007" class="small">Routes to ready application pods</text>

  <text x="862" y="950" class="card-title">Spring Boot replicas</text>
  <text x="862" y="984" class="card-copy">REST API · JPA · Actuator</text>
  <text x="862" y="1007" class="small">Deployment maintains desired replicas</text>

  <text x="1232" y="950" class="card-title">Managed PostgreSQL</text>
  <text x="1232" y="984" class="card-copy">Supabase or PostgreSQL service</text>
  <text x="1232" y="1007" class="small">Schema: app · tables: courses, albums</text>

  <path d="M282 978H310" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M538 978H566" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M804 978H832" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <path d="M1155 978H1202" fill="none" stroke="#0f9f8f" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <text x="1160" y="960" class="flow">JDBC</text>

  <path d="M1425 347V455" fill="none" stroke="#4263eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>
  <text x="1438" y="393" class="flow">image pull</text>
  <rect x="1284" y="702" width="238" height="52" rx="14" fill="#fff8e8" stroke="#f4c98c"/>
  <text x="1301" y="724" font-size="12" font-weight="700" fill="#9a5b0a">Kubernetes Secret: spring-db</text>
  <text x="1301" y="742" class="small">Datasource URL and credentials</text>
  <path d="M1284 728H1190V805H1080V904" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/>

  <text x="62" y="1082" font-size="12" fill="#64748b">Note: port-forwarding is for local development. Use an Ingress or Gateway with DNS/TLS for public production access.</text>
</svg>
