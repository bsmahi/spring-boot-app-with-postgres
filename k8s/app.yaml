apiVersion: v1
kind: Namespace
metadata:
  name: spring-boot-app-with-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app-with-postgres
  namespace: spring-boot-app-with-postgres
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-boot-app-with-postgres
  template:
    metadata:
      labels:
        app: spring-boot-app-with-postgres
    spec:
      containers:
        - name: spring-boot-app-with-postgres
          image: ghcr.io/bsmahi/spring-boot-app-with-postgres:v1
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: validate
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health
          envFrom:
            - secretRef:
                name: spring-db
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app-with-postgres
  namespace: spring-boot-app-with-postgres
spec:
  selector:
    app: spring-boot-app-with-postgres
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
