apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spring-boot-app-with-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bsmahi/spring-boot-app-with-postgres.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: spring-boot-app-with-postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
